<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জন্ম নিবন্ধন সার্টিফিকেট</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f0f0f0; }
        .header { background: #008080; color: white; padding: 10px; text-align: center; }
        .container { width: 100%; height: calc(100vh - 50px); position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <div class="header">
        <h2>জন্ম নিবন্ধন সার্টিফিকেট প্রিন্ট/ডাউনলোড করুন</h2>
        <small>প্রিন্ট বা সেভ করার জন্য ব্রাউজারের Ctrl+P ব্যবহার করুন অথবা Right Click > Save As</small>
    </div>
    
    <div class="container">
        <div id="loading" class="loading">ডাটা লোড হচ্ছে...</div>
        <!-- এখানে API URL টি বসানো হবে -->
        <iframe id="certFrame" src="" onload="document.getElementById('loading').style.display='none'"></iframe>
    </div>

    <script>
        // URL থেকে BRN এবং DOB পড়া
        const params = new URLSearchParams(window.location.search);
        const brn = params.get('brn');
        const dob = params.get('dob');

        if (brn && dob) {
            // API URL তৈরি
            const apiUrl = `https://lmnxbirth-cirtificate-api-pdf.vercel.app?brn=${encodeURIComponent(brn)}&dob=${encodeURIComponent(dob)}`;
            
            // Iframe Source সেট করা
            document.getElementById('certFrame').src = apiUrl;
        } else {
            alert("অবৈধ ডাটা! অনুগ্রহ করে সঠিক BRN এবং DOB দিন।");
            window.close();
        }
    </script>
</body>
</html>
