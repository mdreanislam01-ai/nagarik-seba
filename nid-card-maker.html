 <style>
 @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
 
 :root {
 --orange: #f05a0a;
 --ink: #172033;
 --line: #dedbd5;
 --cream: #fffdf8;
 --bg: #f6f7f9;
 }
 
 * { box-sizing: border-box; }
 
 body {
 margin: 0;
 background: var(--bg);
 color: var(--ink);
 font-family: 'Noto Sans Bengali', Arial, sans-serif;
 font-size: 14px;
 padding-bottom: 80px;
 }
 
 main {
 max-width: 650px;
 margin: auto;
 padding: 20px 16px;
 }
 
 .pagehead {
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 8px;
 margin: 10px 0 24px;
 }
 
 h1 { font-size: 22px; margin: 0; font-weight: 800; }
 
 .card {
 background: var(--cream);
 border: 1px solid #e8e3da;
 border-radius: 20px;
 padding: 22px 18px;
 margin-bottom: 22px;
 box-shadow: 0 2px 5px #00000008;
 }
 
 /* Upload Area Styling */
 .upload-area {
 border: 2px dashed #ffd0b5;
 border-radius: 18px;
 min-height: 120px;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 text-align: center;
 padding: 18px;
 color: #999;
 background: #fffaf4;
 cursor: pointer;
 margin-bottom: 20px;
 transition: all 0.2s;
 }
 
 .upload-area:hover { background: #fff0e0; border-color: var(--orange); }
 .upload-icon { font-size: 24px; color: var(--orange); margin-bottom: 8px; }
 input[type="file"] { display: none; }
 
 label {
 display: block;
 font-size: 15px;
 margin: 14px 0 7px;
 color: #4b4f58;
 font-weight: 600;
 }
 
 input, select, textarea {
 width: 100%;
 padding: 13px 14px;
 border: 1px solid #d8d5d0;
 border-radius: 12px;
 background: #fffdfa;
 font: 15px 'Noto Sans Bengali', sans-serif;
 color: #333;
 outline: none;
 }
 
 input:focus, textarea:focus {
 border-color: #f5a06f;
 box-shadow: 0 0 0 3px #f05a0a14;
 }
 
 textarea { min-height: 100px; resize: vertical; }
 
 .grid2 {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 12px;
 }
 
 .btn-primary {
 display: block;
 width: 100%;
 margin: 30px 0 10px;
 padding: 16px;
 border: 1px solid #bd4700;
 border-radius: 16px;
 background: linear-gradient(#ff6817, #e94d00);
 color: white;
 font: 700 18px 'Noto Sans Bengali';
 box-shadow: 0 4px 0 #b83d00, 0 7px 14px #f05a0a2c;
 cursor: pointer;
 transition: transform 0.1s;
 }
 
 .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #b83d00; }
 .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
 
 /* Loader */
 #loader {
 position: fixed;
 top: 0; left: 0; right: 0; bottom: 0;
 background: rgba(255,255,255,0.95);
 z-index: 999;
 display: none;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 }
 .spinner {
 width: 40px; height: 40px;
 border: 4px solid #f3f3f3;
 border-top: 4px solid var(--orange);
 border-radius: 50%;
 animation: spin 1s linear infinite;
 margin-bottom: 15px;
 }
 @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
 
 /* Toast Notification */
 #toast {
 visibility: hidden;
 min-width: 250px;
 background-color: #333;
 color: #fff;
 text-align: center;
 border-radius: 8px;
 padding: 16px;
 position: fixed;
 z-index: 1001;
 left: 50%;
 bottom: 30px;
 transform: translateX(-50%);
 font-size: 14px;
 }
 #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
 @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
 @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

 
.ns-bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #e7e9ee;display:flex;justify-content:space-around;align-items:center;z-index:10}
html.dark .ns-bottom{background:#1e293b;border-top-color:#334155}
.ns-navitem{text-align:center;color:#475569;font-size:11px;min-width:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:Inter,sans-serif}
.ns-navitem.active{color:#f36b17}
.nico{display:flex;align-items:center;justify-content:center;height:24px}
.nico svg{width:24px;height:24px;display:block}
</style>
</head>

<script>
 // --- Helper Functions ---

 // Resize Image to reduce size and avoid URI_TOO_LONG
 const resizeImage = (file, maxWidth = 150, maxHeight = 150) => {
 return new Promise((resolve, reject) => {
 const reader = new FileReader();
 reader.readAsDataURL(file);
 reader.onload = (event) => {
 const img = new Image();
 img.src = event.target.result;
 img.onload = () => {
 const canvas = document.createElement('canvas');
 let width = img.width;
 let height = img.height;

 if (width > maxWidth) {
 height = Math.round(height * (maxWidth / width));
 width = maxWidth;
 }
 if (height > maxHeight) {
 width = Math.round(width * (maxHeight / height));
 height = maxHeight;
 }

 canvas.width = width;
 canvas.height = height;
 const ctx = canvas.getContext('2d');
 ctx.drawImage(img, 0, 0, width, height);
 resolve(canvas.toDataURL('image/jpeg', 0.7)); // Compress to 70% quality
 };
 img.onerror = reject;
 };
 reader.onerror = reject;
 });
 };

 // DOM Elements
 const form = document.getElementById('nidForm');
 const loader = document.getElementById('loader');
 const toast = document.getElementById("toast");

 const showToast = (msg) => {
 toast.className = "show";
 toast.innerText = msg;
 setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
 }

 const showLoader = () => loader.style.display = 'flex';
 const hideLoader = () => loader.style.display = 'none';

 // Main Form Handler
 form.addEventListener('submit', (e) => {
  e.preventDefault();
  var nidEl=document.getElementById('nid');
  var nid=(nidEl?nidEl.value.trim():'');
  if(!/^\d{10}$/.test(nid)){nsToast('সঠিক ১০ সংখ্যার এনআইডি লিখুন।');if(nidEl)nidEl.focus();return;}
  var payload={nid:nid};
  ['name','name_bn','father_bn','mother_bn','date_of_birth','blood_group','bplace_bn','serial','address','issue_date'].forEach(function(id){var el=document.getElementById(id);if(el&&el.value.trim())payload[id]=el.value.trim();});
  nsWireSubmit({service_id:'nidcard',option_name:null,payload:payload,btn:document.querySelector('#nidForm button[type=submit]')});
});
</script>

<script>

/* ===== ns-wire: real order wiring (injected 2026-11-12) ===== */
var NS_NOTIF_KEY='ns_notifs';
var NS_ORDER_STATUS_KEY='ns_order_status';
var NS_SERVICE_BN={sign:'সাইন কপি অর্ডার',location:'লোকেশন অর্ডার',calllist:'কল লিস্ট',info:'INFO: bKash/Nagad/Rocket',passport:'Passport SB Copy',newbdris:'নতুন জন্ম নিবন্ধন',nid2allnumber:'NID to All Number',i2an:'IMEI to Phone Number',nidcard:'এনআইডি কপি অর্ডার',servercopy:'সার্ভার কপি অর্ডার',sc:'সার্ভার কপি ডাউনলোড',brn:'জন্মনিবন্ধন ক্রিয়েট',nid:'এনআইডি ক্রিয়েট'};
function nsEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nsToken(){try{return localStorage.getItem('ns_token');}catch(e){return null;}}
function nsReadJSON(k,fb){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?fb:v;}catch(e){return fb;}}
function nsWriteJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function nsSvcBn(sid){return NS_SERVICE_BN[sid]||sid;}
function nsStatusBn(st){return {Pending:'অপেক্ষমাণ',Received:'গৃহীত',Completed:'সম্পন্ন',Refunded:'টাকা ফেরত'}[st]||st;}
function nsFmtTime(ts){if(!ts)return '';try{var d=new Date(ts);return d.toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function nsToast(msg){var t=document.getElementById('toast');if(t){t.textContent=msg;t.classList.add('show');clearTimeout(window.__nsToastT);window.__nsToastT=setTimeout(function(){t.classList.remove('show');},3200);return;}var d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99999;max-width:92vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3)';document.body.appendChild(d);setTimeout(function(){d.remove();},3200);}
function fmtBDT(n){var x=Math.round(Number(n)||0);return x.toLocaleString('en-US');}
function setBalance(n){try{localStorage.setItem('ns_balance',String(n));}catch(e){}var els=document.querySelectorAll('.amt');for(var i=0;i<els.length;i++){els[i].textContent='৳ '+fmtBDT(n);}var bs=document.querySelectorAll('.balance b');for(var j=0;j<bs.length;j++){bs[j].textContent='৳ '+fmtBDT(n);}var tb=document.getElementById('topBal');if(tb)tb.textContent='৳ '+fmtBDT(n);var bals=document.querySelectorAll('.bal');for(var k=0;k<bals.length;k++){bals[k].textContent='৳ '+fmtBDT(n);}}
function loadBalance(){var t=nsToken();if(!t)return;fetch('/api/me',{headers:{'Authorization':'Bearer '+t}}).then(function(r){return r.json();}).then(function(d){if(d&&d.wallet_bdt!=null)setBalance(d.wallet_bdt);}).catch(function(){});}
function nsAddNotif(n){var arr=nsReadJSON(NS_NOTIF_KEY,[]);arr.unshift(n);nsWriteJSON(NS_NOTIF_KEY,arr.slice(0,60));nsUpdateBellBadge();}
function nsUpdateBellBadge(){var arr=nsReadJSON(NS_NOTIF_KEY,[]);var unseen=arr.filter(function(x){return !x.seen;}).length;var els=document.querySelectorAll('.greenDot,.nsBellDot,.bell-dot');for(var i=0;i<els.length;i++){els[i].style.display=unseen>0?'block':'none';}var cs=document.querySelectorAll('.greenDot .count,.bellCount,.nsBellCount');for(var j=0;j<cs.length;j++){cs[j].textContent=unseen;}}
function nsB64ToBlob(b64,mime){var bin=atob(b64);var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++){arr[i]=bin.charCodeAt(i);}return new Blob([arr],{type:mime||'application/octet-stream'});}
function nsDownloadDelivery(orderId,delId,btn){var t=nsToken();if(!t){nsToast('আবার লগইন করুন।');return;}if(btn){btn.disabled=true;}fetch('/api/orders/'+orderId+'/deliveries',{headers:{'Authorization':'Bearer '+t}}).then(function(r){return r.json();}).then(function(d){var list=(d&&d.deliveries)||[];var it=null;for(var i=0;i<list.length;i++){if(String(list[i].id)===String(delId)){it=list[i];break;}}if(!it){nsToast('ডেলিভারি পাওয়া যায়নি।');return;}if(it.kind==='text'){var blob=new Blob([it.text_content||''],{type:'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(it.file_name||('delivery-'+orderId+'.txt'));document.body.appendChild(a);a.click();a.remove();}else{var b2=nsB64ToBlob(it.file_data,it.mime_type);var a2=document.createElement('a');a2.href=URL.createObjectURL(b2);a2.download=it.file_name||('delivery-'+orderId);document.body.appendChild(a2);a2.click();a2.remove();}}).catch(function(){nsToast('ডাউনলোড হয়নি, আবার চেষ্টা করুন।');}).finally(function(){if(btn)btn.disabled=false;});}
function ohStatusPill(st){var c={Pending:'background:#fef3c7;color:#92400e',Received:'background:#dbeafe;color:#1e40af',Completed:'background:#dcfce7;color:#166534',Refunded:'background:#fee2e2;color:#991b1b'}[st]||'background:#f3f4f6;color:#374151';return '<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;'+c+'">'+nsEsc(nsStatusBn(st))+'</span>';}
/* Generic real submit. cfg: {service_id, option_name|null, payload, btn, btnLabel, onSuccess, clearForm} */
function nsWireSubmit(cfg){
  var t=nsToken();
  if(!t){nsToast('আবার লগইন করুন।');location.href='login.html';return;}
  var btn=cfg.btn||null;
  var label=cfg.btnLabel||(btn?btn.textContent:'');
  if(btn){btn.disabled=true;btn.style.opacity='.6';}
  var body={service_id:cfg.service_id,payload:cfg.payload||{}};
  if(cfg.option_name)body.option_name=cfg.option_name;
  fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(d){return {st:r.status,d:d};});})
  .then(function(res){
    var st=res.st,d=res.d||{};
    if(st===201&&d.order){
      var amt=d.order.amount_bdt!=null?d.order.amount_bdt:(d.wallet_bdt!=null?null:null);
      if(d.wallet_bdt!=null)setBalance(d.wallet_bdt);
      try{var prev=nsReadJSON(NS_ORDER_STATUS_KEY,{});prev[String(d.order.id)]=d.order.status;nsWriteJSON(NS_ORDER_STATUS_KEY,prev);}catch(e){}
      var svc=nsSvcBn(cfg.service_id);
      var amtTxt=(d.order.amount_bdt!=null)?('৳'+fmtBDT(d.order.amount_bdt)):'';
      nsAddNotif({id:'ns-o'+d.order.id+'-'+Date.now(),icon:'🛒',title:svc+' অর্ডার সফল',body:'অর্ডার #'+d.order.id+' জমা হয়েছে।'+(amtTxt?' '+amtTxt+' কাটা হয়েছে।':''),time:Date.now(),seen:false,orderId:d.order.id,orderStatus:d.order.status});
      nsToast('অর্ডার জমা হয়েছে! অর্ডার #'+d.order.id);
      if(cfg.clearForm)cfg.clearForm();
      if(cfg.onSuccess)cfg.onSuccess(d.order);
      nsWireLoadOrders(cfg.service_id);
    }else if(st===400&&d.error==='insufficient_balance'){
      nsToast('অপর্যাপ্ত ব্যালেন্স। দয়া করে রিচার্জ করুন।');
    }else if(st===403&&d.error==='orders_closed'){
      nsToast('অর্ডার গ্রহণ বর্তমানে বন্ধ আছে।');
    }else if(st===404){
      nsToast('সার্ভিসটি পাওয়া যায়নি।');
    }else if(st===401){
      nsToast('আবার লগইন করুন।');location.href='login.html';
    }else{
      nsToast((d&&d.message)||'অর্ডার জমা হয়নি, আবার চেষ্টা করুন।');
    }
  })
  .catch(function(){nsToast('নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন।');})
  .finally(function(){if(btn){btn.disabled=false;btn.style.opacity='';if(label&&btn.textContent!==label){/* keep label set by caller */}}});
}
/* Bottom real order list for one service. Renders into #nsList. */
function nsWireLoadOrders(serviceId){
  var box=document.getElementById('nsList');if(!box)return;
  var t=nsToken();if(!t){box.innerHTML='';return;}
  fetch('/api/orders',{headers:{'Authorization':'Bearer '+t}})
  .then(function(r){return r.json();})
  .then(function(d){
    var all=(d&&d.orders)||[];
    var list=all.filter(function(o){return o.service_id===serviceId;}).slice(0,5);
    var emptyEl=document.querySelector('.empty');
    if(!list.length){
      box.innerHTML='';
      if(emptyEl)emptyEl.style.display='';
      var more=document.getElementById('nsListMore');if(more)more.style.display='none';
      return;
    }
    if(emptyEl)emptyEl.style.display='none';
    var more2=document.getElementById('nsListMore');if(more2)more2.style.display='';
    var h='';
    list.forEach(function(o){
      var opt=o.option_name?(' · '+nsEsc(o.option_name)):'';
      h+='<div style="border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer" onclick="nsWireToggle('+o.id+')">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:13px">#'+o.id+' · '+nsEsc(nsSvcBn(o.service_id))+opt+'</b>'+ohStatusPill(o.status)+'</div>'
        +'<div style="display:flex;justify-content:space-between;color:#6b7280;font-size:12px;margin-top:4px"><span>৳'+fmtBDT(o.amount_bdt)+'</span><span>'+nsEsc(nsFmtTime(o.created_at))+'</span></div>'
        +'<div id="nsDet-'+o.id+'" style="display:none;margin-top:8px;border-top:1px dashed #e5e7eb;padding-top:8px;font-size:13px;color:#374151">লোড হচ্ছে…</div>'
        +'</div>';
    });
    box.innerHTML=h;
  })
  .catch(function(){box.innerHTML='';});
}
function nsWireToggle(id){
  var el=document.getElementById('nsDet-'+id);if(!el)return;
  if(el.style.display==='none'){el.style.display='block';nsWireRenderDetail(id);}else{el.style.display='none';}
}
function nsWireRenderDetail(id){
  var el=document.getElementById('nsDet-'+id);if(!el)return;
  var t=nsToken();if(!t){el.textContent='আবার লগইন করুন।';return;}
  fetch('/api/orders/'+id+'/deliveries',{headers:{'Authorization':'Bearer '+t}})
  .then(function(r){return r.json();})
  .then(function(d){
    var list=(d&&d.deliveries)||[];
    if(!list.length){el.innerHTML='<span style="color:#6b7280">এখনো কোনো ডেলিভারি আসেনি।</span>';return;}
    var h='<div style="font-weight:700;margin-bottom:6px">ডেলিভারি</div>';
    list.forEach(function(it){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0"><span>'+nsEsc(it.file_name||(it.kind==='text'?'টেক্সট ডেলিভারি':'ফাইল'))+'</span><button type="button" onclick="event.stopPropagation();nsDownloadDelivery('+id+','+it.id+',this)" style="background:#16a34a;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer">ডাউনলোড</button></div>';
    });
    el.innerHTML=h;
  })
  .catch(function(){el.textContent='লোড হয়নি।';});
}

window.__nsWireService='nidcard';
document.addEventListener('DOMContentLoaded',function(){loadBalance();nsUpdateBellBadge();nsWireLoadOrders('nidcard');});
</script>
