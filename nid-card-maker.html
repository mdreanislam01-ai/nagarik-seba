<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID কার্ড মেকার — নগরীক সেবা</title>
    <!-- ফন্ট এবং স্টাইল (তোমার দেওয়া ফাইলের মতো) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --orange: #f05a0a;
            --ink: #172033;
            --muted: #929292;
            --line: #dedbd5;
            --cream: #fffdf8;
            --bg: #f6f7f9;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Noto Sans Bengali', Arial, sans-serif;
            font-size: 14px;
            padding-bottom: 80px; /* Bottom nav space */
        }
        
        main {
            max-width: 650px;
            margin: auto;
            padding: 20px 16px;
        }
        
        .pagehead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 10px 0 24px;
        }
        
        h1 { font-size: 22px; margin: 0; font-weight: 800; }
        
        .card {
            background: var(--cream);
            border: 1px solid #e8e3da;
            border-radius: 20px;
            padding: 22px 18px;
            margin-bottom: 22px;
            box-shadow: 0 2px 5px #00000008;
        }
        
        /* Upload Area Styling */
        .upload-area {
            border: 2px dashed #ffd0b5;
            border-radius: 18px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 18px;
            color: #999;
            background: #fffaf4;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        
        .upload-area:hover { background: #fff0e0; border-color: var(--orange); }
        .upload-area small { font-size: 12px; margin-top: 5px; color: #888; }
        .upload-icon { font-size: 24px; color: var(--orange); margin-bottom: 8px; }
        
        input[type="file"] { display: none; }
        
        label {
            display: block;
            font-size: 15px;
            margin: 14px 0 7px;
            color: #4b4f58;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8d5d0;
            border-radius: 12px;
            background: #fffdfa;
            font: 15px 'Noto Sans Bengali', sans-serif;
            color: #333;
            outline: none;
            box-shadow: 0 1px 3px #0000000a;
        }
        
        input:focus, textarea:focus {
            border-color: #f5a06f;
            box-shadow: 0 0 0 3px #f05a0a14;
        }
        
        textarea { min-height: 100px; resize: vertical; }
        
        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .btn-primary {
            display: block;
            width: 100%;
            margin: 30px 0 10px;
            padding: 16px;
            border: 1px solid #bd4700;
            border-radius: 16px;
            background: linear-gradient(#ff6817, #e94d00);
            color: white;
            font: 700 18px 'Noto Sans Bengali';
            box-shadow: 0 4px 0 #b83d00, 0 7px 14px #f05a0a2c;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #b83d00; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .info-box {
            background: #fff8f6;
            border: 1px solid #ffd3c1;
            border-radius: 15px;
            padding: 16px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        
        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Preview Modal */
        #previewModal {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        .modal-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        iframe { width: 100%; height: 600px; border: none; background: #eee; }
        .modal-footer { padding: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .btn-download { background: var(--orange); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #eee; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

    </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
    <div>পিডিএফ তৈরি হচ্ছে...</div>
</div>

<!-- Preview Modal -->
<div id="previewModal">
    <div class="modal-content">
        <div class="modal-header">
            <span>প্রিভিউ</span>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <iframe id="pdfFrame" src=""></iframe>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">বন্ধ</button>
            <button class="btn-download" id="forceDownloadBtn">ডাউনলোড</button>
        </div>
    </div>
</div>

<main>
    <div class="pagehead">
        <h1>NID কার্ড মেকার</h1>
        <!-- Optional Back Button if needed -->
    </div>

    <form id="nidForm">
        <!-- Profile Image -->
        <label>প্রোফাইল ছবি</label>
        <div class="upload-area" onclick="document.getElementById('profileInput').click()">
            <div class="upload-icon">📷</div>
            <strong>ছবি আপলোড করুন</strong>
            <small>JPG/PNG (Max 2MB)</small>
            <input type="file" id="profileInput" accept="image/*" required>
        </div>

        <!-- Personal Info -->
        <div class="grid2">
            <div>
                <label>পার্ট নাম *</label>
                <input type="text" id="name" placeholder="Rakib Hossain" required>
            </div>
            <div>
                <label>বাংলা নাম *</label>
                <input type="text" id="name_bn" placeholder="রাকিব হোসাইন" required>
            </div>
        </div>

        <div class="grid2">
            <div>
                <label>বাবার নাম (বাংলা)</label>
                <input type="text" id="father_bn" placeholder="আব্দুল হাই">
            </div>
            <div>
                <label>মায়ের নাম (বাংলা)</label>
                <input type="text" id="mother_bn" placeholder="জয়নাব বানু">
            </div>
        </div>

        <div class="grid2">
            <div>
                <label>জন্ম তারিখ</label>
                <input type="date" id="date_of_birth">
            </div>
            <div>
                <label>রক্তের গ্রুপ</label>
                <input type="text" id="blood_group" placeholder="B+">
            </div>
        </div>
        
        <div class="grid2">
             <div>
                <label>জন্মস্থান (বাংলা)</label>
                <input type="text" id="bplace_bn" placeholder="নীলফামারী">
            </div>
            <div>
                <label>মূল নম্বর (Serial)</label>
                <input type="text" id="serial" placeholder="০১">
            </div>
        </div>

        <label>ঠিকানা (লাইন ভাঙতে | চিহ্ন ব্যবহার করুন)</label>
        <textarea id="address" placeholder="বাসা/হোল্ডিং: সুখধন | গ্রাম/রাস্তা: রামগঞ্জ | ..."></textarea>

        <label>NID নম্বর (১০ ডিজিট) *</label>
        <input type="text" id="nid" placeholder="1234567890" maxlength="10" pattern="\d{10}" required>

        <label>কার্ড ইস্যু তারিখ</label>
        <input type="date" id="issue_date">

        <!-- Signature Upload -->
        <div style="margin-top: 20px;">
            <label>কার্ডধারীর স্বাক্ষর</label>
            <div class="upload-area" style="min-height: 80px;" onclick="document.getElementById('sigInput').click()">
                <div class="upload-icon">✍️</div>
                <strong>স্বাক্ষর আপলোড</strong>
                <input type="file" id="sigInput" accept="image/png" required>
            </div>
        </div>

        <button type="submit" class="btn-primary" id="generateBtn">পিডিএফ জেনারেট করুন</button>
        
        <div class="info-box">
            <b>দ্রষ্টব্য:</b> সব তথ্য সঠিকভাবে দিন। পিডিএফ জেনারেট হওয়ার পর আপনি এটি ডাউনলোড করতে পারবেন। 
            নেটওয়ার্ক সমস্যার কারণে কিছু সময় লাগতে পারে।
        </div>
    </form>
</main>

<script>
    // --- Helper Functions ---
    
    // File to Base64 Converter
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    // DOM Elements
    const form = document.getElementById('nidForm');
    const loader = document.getElementById('loader');
    const modal = document.getElementById('previewModal');
    const pdfFrame = document.getElementById('pdfFrame');
    const forceDownloadBtn = document.getElementById('forceDownloadBtn');

    // UI Helpers
    const showLoader = () => loader.style.display = 'flex';
    const hideLoader = () => loader.style.display = 'none';
    const openModal = (url) => {
        pdfFrame.src = url;
        modal.style.display = 'flex';
    };
    const closeModal = () => {
        modal.style.display = 'none';
        pdfFrame.src = '';
    };

    // Force Download Logic for Blob URLs
    forceDownloadBtn.onclick = function() {
        const src = pdfFrame.src;
        if(!src) return;
        
        // Fetch the blob and trigger download
        fetch(src)
            .then(response => response.blob())
            .then(blob => {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `NID_Card_${document.getElementById('nid').value}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            })
            .catch(err => {
                alert("ডাউনলোড শুরু করা যাচ্ছে না। অনুগ্রহ করে পেজে রাইট ক্লিক করে 'Save As' দিন।");
            });
    };

    // Main Form Handler
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Validation
        const nidVal = document.getElementById('nid').value;
        if(nidVal.length !== 10 || isNaN(nidVal)) {
            alert("NID নম্বর অবশ্যই ১০ সংখ্যার হতে হবে।");
            return;
        }

        showLoader();
        
        try {
            // 1. Convert Images to Base64
            const profileFile = document.getElementById('profileInput').files[0];
            const sigFile = document.getElementById('sigInput').files[0];

            if (!profileFile || !sigFile) {
                alert("দয়া করে প্রোফাইল ছবি এবং স্বাক্ষর আপলোড করুন।");
                hideLoader();
                return;
            }

            const [profileBase64, sigBase64] = await Promise.all([
                toBase64(profileFile),
                toBase64(sigFile)
            ]);

            // 2. Construct Params
            const params = new URLSearchParams();
            
            // Required
            params.append('nid', nidVal);
            params.append('name', document.getElementById('name').value.toUpperCase());
            params.append('name_bn', document.getElementById('name_bn').value);
            
            // Optional Fields
            const father = document.getElementById('father_bn').value;
            if(father) params.append('father_bn', father);
            
            const mother = document.getElementById('mother_bn').value;
            if(mother) params.append('mother_bn', mother);
            
            const address = document.getElementById('address').value;
            if(address) params.append('address', address);
            
            const dob = document.getElementById('date_of_birth').value;
            if(dob) params.append('date_of_birth', dob);
            
            const issueDate = document.getElementById('issue_date').value;
            if(issueDate) params.append('issue_date', issueDate);
            
            const blood = document.getElementById('blood_group').value;
            if(blood) params.append('blood_group', blood);
            
            const bplace = document.getElementById('bplace_bn').value;
            if(bplace) params.append('bplace_bn', bplace);
            
            const serial = document.getElementById('serial').value;
            if(serial) params.append('serial', serial);

            // Images
            params.append('profile', profileBase64);
            params.append('own_sig', sigBase64);
            params.append('author_sig', sigBase64); // Using same signature for author as well, or you can add another input

            // 3. Call API
            const apiUrl = `https://nid-one.vercel.app/?${params.toString()}`;
            
            // Open in iframe/modal
            openModal(apiUrl);
            
            // Hide loader after a brief moment since iframe loads async
            setTimeout(hideLoader, 1000);

        } catch (error) {
            console.error(error);
            alert("একটি ত্রুটি ঘটেছে। আবার চেষ্টা করুন।");
            hideLoader();
        }
    });
</script>

</body>
</html>
