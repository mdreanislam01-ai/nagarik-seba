<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নাগরিক সেবা — ডেমো ক্লায়েন্ট প্যানেল</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="pill" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰ মেনু</button>
  <div class="logo">নাগরিক সেবা<small>nagarikseba.com — ডেমো</small></div>
  <div class="spacer"></div>
  <button class="pill" onclick="showModal('ব্যালান্স','এটি শুধু ডিসপ্লে। ডেমো ব্যালান্স: $ 10। কোনো আসল টাকা কাটা হয় না।')">💰 $ 10</button>
  <span>👤 নমুনা ব্যবহারকারী <span style="background:#fff;color:#0f766e;border-radius:99px;padding:2px 8px;font-size:12px">Verified ✓</span></span>
  <button class="pill" id="darkBtn" onclick="toggleDark()">🌙 ডার্ক মোড</button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><p><button class="btn" onclick="closeModal()">ঠিক আছে</button></p></div></div>
<script src="app.js"></script>
</body>
</html>
