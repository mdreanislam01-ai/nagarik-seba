<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নাগরিক সেবা — ক্লায়েন্ট প্যানেল</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar topbar-new">
  <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" aria-label="মেনু">☰ <span>মেনু</span></button>
  <div class="logo-new"><span class="logo-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="19" fill="#0f766e"/><circle cx="24" cy="8" r="4" fill="#f59e0b"/><path d="M24 40V22M24 30c-6-1-10-5-11-11 6 1 10 5 11 11zm0 0c6-1 10-5 11-11-6 1-10 5-11 11z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-text">নাগরিক সেবা<small>nagarikseba.com</small></span></div>
  <div class="spacer"></div>
  <button class="dark-pill" id="darkBtn" onclick="toggleDark()"><span class="moon" aria-hidden="true">☾</span><span id="darkLabel">ডার্ক মোড</span><span class="switch" aria-hidden="true"><span class="knob"></span></span></button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><p><button class="btn" onclick="closeModal()">ঠিক আছে</button></p></div></div>
<script src="app.js"></script>
</body>
</html>
