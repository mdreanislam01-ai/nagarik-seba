<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Copy Create - NID Service</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #0056b3; 
            margin-bottom: 20px; 
            font-size: 24px;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 600; 
            color: #333; 
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 25px; 
        }
        button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .btn-fetch { 
            background-color: #007bff; 
            color: white; 
        }
        .btn-fetch:hover { 
            background-color: #0056b3; 
        }
        .btn-print { 
            background-color: #28a745; 
            color: white; 
            display: none; /* Initially hidden */
        }
        .btn-print:hover { 
            background-color: #218838; 
        }
        #status { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 5px; 
            display: none; 
            text-align: center; 
            font-size: 14px; 
        }
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        iframe { 
            width: 100%; 
            height: 0; 
            border: none; 
            margin-top: 20px; 
            transition: height 0.3s; 
            border-radius: 6px; 
            border: 1px solid #ddd; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Server Copy Create</h2>
    
    <label for="nid">NID Number:</label>
    <input type="text" id="nid" placeholder="Enter your NID">

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">

    <label for="version">Select Version:</label>
    <select id="version">
        <option value="1">Version 1 (Smart Card)</option>
        <option value="2">Version 2 (Old Jatiya)</option>
    </select>

    <div class="btn-group">
        <button class="btn-fetch" onclick="loadServerData()">📥 Load Data</button>
        <button class="btn-print" id="printBtn" onclick="generatePdf()">🖨️ Download PDF</button>
    </div>

    <div id="status"></div>
    <iframe id="resultFrame"></iframe>
</div>

<script>
    const apiKey = '2a3b267ca79e6abc23fb675a0e381656';
    // 🔥 Using a CORS Proxy to bypass browser restrictions
    const proxyUrl = 'https://api.allorigins.win/raw?url='; 

    async function loadServerData() {
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;
        const version = document.getElementById('version').value;

        if (!nid || !dob) {
            alert("Please enter both NID and Date of Birth.");
            return;
        }

        const statusEl = document.getElementById('status');
        statusEl.className = 'loading';
        statusEl.style.display = 'block';
        statusEl.innerText = `Loading ${version} data...`;
        
        document.querySelectorAll('button').forEach(b => b.disabled = true);
        document.getElementById('printBtn').style.display = 'none';

        try {
            // Construct the target URL
            const targetUrl = `https://servercopy.work/sv.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
            
            // Fetch via Proxy
            const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
            
            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            
            const htmlText = await response.text();
            
            if (!htmlText || htmlText.includes('<!DOCTYPE')) {
                 throw new Error("Invalid data received from server");
            }

            lastHtmlContent = htmlText; 

            // Show in iframe
            const iframe = document.getElementById('resultFrame');
            iframe.srcdoc = htmlText; 
            
            // Auto-adjust height
            iframe.height = Math.max(htmlText.length * 0.5, 500); 
            
            document.getElementById('printBtn').style.display = 'block';
            showStatus(`✅ ${version} Data Loaded Successfully!`, "success");

        } catch (error) {
            console.error(error);
            showStatus("❌ Failed: " + error.message, "error");
            document.querySelectorAll('button').forEach(b => b.disabled = false);
        }
    }

    let lastHtmlContent = '';

    function generatePdf() {
        if (!lastHtmlContent) {
            alert("No data loaded yet!");
            return;
        }

        const win = window.open('', '', 'height=700,width=900');
        win.document.write('<html><head><title>NID Document</title>');
        win.document.write('<style>body{font-family:Arial,sans-serif;padding:20px;} @media print{body{padding:0;}}</style>');
        win.document.write(lastHtmlContent);
        win.document.write('</body></html>');
        win.document.close();
        
        setTimeout(() => {
            win.focus();
            win.print();
            win.onfocus = () => win.close(); 
        }, 500);
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.className = type;
        el.style.display = 'block';
        el.innerText = msg;
        if(type === 'success') setTimeout(() => el.style.display = 'none', 3000);
    }
</script>

</body>
</html>
