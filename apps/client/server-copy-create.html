<!DOCTYPE html>
<html lang="bn">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Server Copy Create - Official</title>
 <style>
 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background-color: #f0f4f8;
 margin: 0;
 padding: 20px;
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 }
 .card {
 background: white;
 padding: 30px;
 border-radius: 12px;
 box-shadow: 0 4px 6px rgba(0,0,0,0.1);
 width: 100%;
 max-width: 450px;
 position: relative;
 }
 h2 {
 color: #1e3a8a;
 text-align: center;
 margin-bottom: 20px;
 font-size: 24px;
 }
 label {
 display: block;
 margin-top: 15px;
 font-weight: 600;
 color: #333;
 }
 input {
 width: 100%;
 padding: 12px;
 margin-top: 8px;
 border: 1px solid #ccc;
 border-radius: 6px;
 font-size: 16px;
 box-sizing: border-box;
 }
 button {
 width: 100%;
 padding: 14px;
 margin-top: 25px;
 background-color: #0070f3;
 color: white;
 border: none;
 border-radius: 6px;
 font-size: 16px;
 font-weight: bold;
 cursor: pointer;
 transition: background 0.3s;
 }
 button:hover {
 background-color: #005bb5;
 }
 button:disabled {
 background-color: #ccc;
 cursor: not-allowed;
 }
 #status {
 margin-top: 20px;
 padding: 15px;
 border-radius: 6px;
 display: none;
 text-align: left;
 font-size: 14px;
 background-color: #f9fafb;
 border: 1px solid #e5e7eb;
 max-height: 200px;
 overflow-y: auto;
 }
 .log-item {
 margin-bottom: 5px;
 padding-bottom: 5px;
 border-bottom: 1px dashed #ddd;
 }
 .success { color: #065f46; font-weight: bold; }
 .error { color: #991b1b; font-weight: bold; }
 .info { color: #1e40af; }
 
 .back-btn {
 display: block;
 text-align: center;
 margin-top: 15px;
 color: #0070f3;
 text-decoration: none;
 font-size: 14px;
 }

 /* Loading Overlay */
 #loadingOverlay {
 display: none;
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: rgba(255, 255, 255, 0.95);
 border-radius: 12px;
 z-index: 10;
 justify-content: center;
 align-items: center;
 flex-direction: column;
 }
 .spinner {
 border: 4px solid #f3f3f3;
 border-top: 4px solid #0070f3;
 border-radius: 50%;
 width: 30px;
 height: 30px;
 animation: spin 1s linear infinite;
 margin-bottom: 10px;
 }
 @keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
 }
 </style>
</head>
<body>

<div class="card">
 <!-- Loading Spinner -->
 <div id="loadingOverlay">
 <div class="spinner"></div>
 <span>Connecting to Server...</span>
 </div>

 <h2>🚀 Server Copy Create</h2>
 
 <form id="createForm">
 <label for="nid">NID Number:</label>
 <input type="text" id="nid" placeholder="আপনার NID নম্বর দিন" required pattern="\d{10}" title="Please enter a valid 10-digit NID">

 <label for="dob">Date of Birth:</label>
 <input type="date" id="dob" required>

 <button type="submit" id="btnSubmit">Generate Official PDF</button>
 </form>

 <!-- Status Log Area -->
 <div id="status"></div>
 
 <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<script>
 // 🔒 Hidden Configuration
 const CONFIG = {
 apiKey: '2a3b267ca79e6abc23fb675a0e381656',
 baseUrl: 'https://servercopy.work'
 };

 function addLog(message, type = 'info') {
 const statusDiv = document.getElementById('status');
 statusDiv.style.display = 'block';
 const logItem = document.createElement('div');
 logItem.className = `log-item ${type}`;
 logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
 statusDiv.appendChild(logItem);
 statusDiv.scrollTop = statusDiv.scrollHeight;
 }

 document.getElementById('createForm').addEventListener('submit', async function(e) {
 e.preventDefault();
 
 const nid = document.getElementById('nid').value.trim();
 const dob = document.getElementById('dob').value;
 const btn = document.getElementById('btnSubmit');
 const overlay = document.getElementById('loadingOverlay');
 
 btn.disabled = true;
 btn.textContent = "Fetching Data...";
 document.getElementById('status').innerHTML = ''; 
 overlay.style.display = 'flex'; 

 try {
 addLog('Connecting to server...', 'info');
 
 // Step 1: Fetch Data from API
 const apiUrl = `${CONFIG.baseUrl}/sv.php?key=${CONFIG.apiKey}&nid=${nid}&dob=${dob}`;
 let apiData = null;
 
 try {
 const response = await fetch(apiUrl);
 if (response.ok) {
 const data = await response.json();
 console.log("SV Response:", data);
 if (data.success || data.data) {
 apiData = data;
 addLog('✅ Data fetched successfully.', 'success');
 } else {
 apiData = { error: "No data found", raw: data };
 addLog('⚠️ No specific data found in API response.', 'error');
 }
 } else {
 throw new Error(`HTTP Error: ${response.status}`);
 }
 } catch (err) {
 apiData = { error: err.message, note: "Using fallback mode due to network/CORS issue." };
 addLog(`ℹ️ API check skipped (${err.message}), generating blank form.`, 'info');
 }

 // Step 2: Create HTML Content for the PDF Window
 const printWindow = window.open('', '_blank');
 if (!printWindow) {
 alert("Please allow popups to view the PDF!");
 return;
 }

 // Construct the HTML content dynamically with LOGO and DESIGN
 const formattedDate = new Date(dob).toLocaleDateString('en-GB'); // DD/MM/YYYY format
 const todayDate = new Date().toLocaleDateString('en-GB');

 const finalContent = `
 <!DOCTYPE html>
 <html>
 <head>
 <title>NID Document - ${nid}</title>
 <style>
 body { 
 font-family: Arial, sans-serif; 
 padding: 40px; 
 max-width: 800px; 
 margin: 0 auto; 
 color: #333;
 background: #fff;
 }
 .header { 
 text-align: center; 
 border-bottom: 3px double #333; 
 padding-bottom: 20px; 
 margin-bottom: 30px; 
 }
 .logo-container {
 margin-bottom: 15px;
 }
 .logo-img {
 width: 80px;
 height: auto;
 }
 .content { line-height: 1.8; font-size: 14px; }
 .field { margin-bottom: 15px; display: flex; }
 .label { font-weight: bold; color: #000; width: 150px; }
 .value { flex-grow: 1; border-bottom: 1px dotted #ccc; padding-left: 10px; }
 .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #666; border-top: 1px solid #eee; padding-top: 10px; }
 @media print { 
 body { padding: 20px; } 
 .no-print { display: none; } 
 }
 </style>
 </head>
 <body>
 <div class="header">
<script>
 // Global Variables for Supabase (If you want to add caching later)
 const SUPABASE_URL = 'https://msaxqcgkfmjcldmihyvf.supabase.co';
 const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE'; 
 // Note: If you don't have Supabase yet, this part can be ignored or removed.

 function addLog(message, type = 'info') {
     const statusDiv = document.getElementById('status');
     statusDiv.style.display = 'block';
     const logItem = document.createElement('div');
     logItem.className = `log-item ${type}`;
     logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
     statusDiv.appendChild(logItem);
     statusDiv.scrollTop = statusDiv.scrollHeight;
 }

 document.getElementById('createForm').addEventListener('submit', async function(e) {
     e.preventDefault();
     
     const nid = document.getElementById('nid').value.trim();
     const dob = document.getElementById('dob').value;
     const btn = document.getElementById('btnSubmit');
     
     btn.disabled = true;
     btn.textContent = "Generating...";
     document.getElementById('status').innerHTML = ''; 
     
     try {
         addLog('Connecting to Server...', 'info');
         
         // Configuration
         const baseUrl = 'https://servercopy.work';
         const apiKey = '2a3b267ca79e6abc23fb675a0e381656';
         
         // Step 1: Verify Data via sv.php
         const apiUrl = `${baseUrl}/sv.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
         
         addLog(`Checking NID validity...`, 'info');
         
         let isValid = false;
         try {
             const response = await fetch(apiUrl);
             if (response.ok) {
                 const data = await response.json();
                 console.log("SV Response:", data);
                 if (data.success || data.data) {
                     isValid = true;
                     addLog('✅ NID Verified Successfully!', 'success');
                 } else {
                     addLog('⚠️ Verification failed, but proceeding to generate PDF.', 'error');
                     isValid = true; 
                 }
             } else {
                 throw new Error(`HTTP Error: ${response.status}`);
             }
         } catch (err) {
             addLog(`ℹ️ sv.php connection issue (${err.message}), generating PDF anyway.`, 'info');
             isValid = true; 
         }

         // Step 2: Generate PDF
         const pdfUrl = `${baseUrl}/pdf.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
         
         addLog(`PDF URL: ${pdfUrl}`, 'info');
         addLog('Preparing PDF download...', 'info');
         
         // Open PDF in a new tab
         window.open(pdfUrl, '_blank');
         
         addLog('✅ PDF Generated! Please check your browser downloads.', 'success');

     } catch (error) {
         console.error("Error:", error);
         addLog(`❌ Final Error: ${error.message}`, 'error');
     } finally {
         btn.disabled = false;
         btn.textContent = "Generate & Download PDF";
     }
 });
</script>
