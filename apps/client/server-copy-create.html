<script>
    function fetchData() {
        const nid = document.getElementById('nid').value;
        const dob = document.getElementById('dob').value;
        const apiKey = '2a3b267ca79e6abc23fb675a0e381656';
        
        if(!nid || !dob) {
            alert("Please enter both NID and DOB");
            return;
        }

        // API URL
        const url = `https://servercopy.work/sv.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
        
        console.log("Fetching from:", url);

        fetch(url)
            .then(response => {
                console.log("Response Status:", response.status);
                return response.text(); // Use .text() because sv.php returns text/HTML
            })
            .then(data => {
                console.log("Received Data:", data); // এটি কনসোল লগে দেখাবে
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                // যদি ডাটা খালি থাকে তবে এরর দেখাও
                if (!data || data.trim() === "") {
                    resultDiv.innerHTML = "<strong>Error:</strong> No data received from server.";
                } else {
                    resultDiv.innerHTML = "<strong>Data Received:</strong><br>" + data.replace(/\n/g, '<br>');
                }
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                alert('Failed to connect to server. Check your internet or CORS.');
            });
    }
</script>
