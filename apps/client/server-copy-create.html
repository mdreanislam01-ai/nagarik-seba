<!DOCTYPE html>
<html lang="bn">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Server Copy Create</title>
 <style>
 body { font-family: system-ui, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
 .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
 h2 { color: #1e3a8a; text-align: center; margin-bottom: 20px; }
 label { display: block; margin-top: 15px; font-weight: 600; color: #333; }
 input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
 button { width: 100%; padding: 14px; margin-top: 25px; background-color: #0070f3; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
 button:hover { background-color: #005bb5; }
 button:disabled { background-color: #ccc; }
 #status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; background-color: #f9fafb; border: 1px solid #e5e7eb; }
 .log-item { margin-bottom: 5px; border-bottom: 1px dashed #ddd; padding-bottom: 5px; }
 .success { color: #065f46; font-weight: bold; }
 .error { color: #991b1b; font-weight: bold; }
 .back-btn { display: block; text-align: center; margin-top: 15px; color: #0070f3; text-decoration: none; }
 </style>
 <!-- Supabase SDK -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="card">
 <h2>📄 Server Copy Create</h2>
 <form id="createForm">
     <label for="nid">NID Number:</label>
     <input type="text" id="nid" placeholder="Enter 10-digit NID" required pattern="\d{10}">

     <label for="dob">Date of Birth:</label>
     <input type="date" id="dob" required>

     <button type="submit" id="btnSubmit">Fetch & Save Data</button>
 </form>
 <div id="status"></div>
 <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<script>
 // --- Configuration ---
 const SUPABASE_URL = 'https://msaxqcgkfmjcldmihyvf.supabase.co';
 const SUPABASE_KEY = 'sb_publishable_fwr-UaCeYUoxbTqDr-mcxw_j7EYwiRL';
 const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

 function log(msg, type='info') {
     const div = document.getElementById('status');
     div.style.display = 'block';
     const p = document.createElement('div');
     p.className = `log-item ${type}`;
     p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
     div.appendChild(p);
     div.scrollTop = div.scrollHeight;
 }

 document.getElementById('createForm').addEventListener('submit', async (e) => {
     e.preventDefault();
     const nid = document.getElementById('nid').value.trim();
     const dob = document.getElementById('dob').value;
     const btn = document.getElementById('btnSubmit');

     if (!nid || !dob) return alert("Please fill all fields");

     btn.disabled = true;
     btn.textContent = "Fetching...";
     log("Connecting to Government Server...", "info");

     try {
         // Call your own Vercel API Function
         const response = await fetch('/api/fetch-nid', {
             method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({ nid, dob })
         });

         const result = await response.json();

         if (response.ok) {
             log(`Data fetched! Source: ${result.source}`, "success");
             
             // Generate PDF using the stored data logic or direct link
             // Here we just open the PDF generation page with params
             window.open(`/pdf-viewer.html?nid=${nid}&dob=${dob}`, '_blank');
         } else {
             log(`Error: ${result.error}`, "error");
         }

     } catch (err) {
         console.error(err);
         log(`Network Error: ${err.message}`, "error");
     } finally {
         btn.disabled = false;
         btn.textContent = "Fetch & Save Data";
     }
 });
</script>

</body>
</html>
