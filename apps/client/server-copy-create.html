<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Copy Create - নাগরিক সেবা</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #005bb5;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }
        .success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0070f3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📄 Server Copy Create</h2>
    
    <form id="createForm">
        <label for="nid">NID Number:</label>
        <input type="text" id="nid" placeholder="আপনার NID নম্বর লিখুন" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <button type="submit" id="btnSubmit">Create Server Copy</button>
    </form>

    <div id="status"></div>
    
    <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<script>
    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;
        const btn = document.getElementById('btnSubmit');
        const statusDiv = document.getElementById('status');

        // UI Reset
        btn.disabled = true;
        btn.textContent = "Processing...";
        statusDiv.style.display = 'none';
        statusDiv.className = '';

        try {
            // তোমার API Configuration
            const baseUrl = 'https://servercopy.work';
            const apiKey = '2a3b267ca79e6abc23fb675a0e381656';
            
            // sv.php এ কল করে ডাটা ভেরিফাই করা
            const apiUrl = `${baseUrl}/sv.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
            
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error('সার্ভারের সাথে সংযোগ স্থাপন করা যায়নি।');
            }

            const data = await response.json();

            // সাধারণত sv.php সাকসেসফুল হলে ডাটা ফেরত দেয়। 
            // যদি API নির্দিষ্ট কোনো স্ট্যাটাস ফেরত দেয় (যেমন status: 'success'), তবে সেটা চেক করো।
            
            if (data && (data.status === 'success' || data.data)) { 
                statusDiv.innerHTML = `<strong>সফল!</strong> আপনার ডাটা পাওয়া গেছে।`;
                statusDiv.classList.add('success');
                
                // এখানে তুমি চাইলে ইউজারকে PDF পেজে রিডাইরেক্ট করতে পারো:
                // window.location.href = `${baseUrl}/pdf.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
                
            } else {
                throw new Error(data.message || 'NID ভেরিফিকেশনে ব্যর্থ হয়েছে।');
            }

        } catch (error) {
            statusDiv.innerHTML = `<strong>ত্রুটি:</strong> ${error.message}`;
            statusDiv.classList.add('error');
        } finally {
            btn.disabled = false;
            btn.textContent = "Create Server Copy";
        }
    });
</script>

</body>
</html>
