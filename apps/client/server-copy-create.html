<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Copy Create - NID Service</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #0056b3; 
            margin-bottom: 20px; 
            font-size: 24px;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 600; 
            color: #333; 
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 25px; 
        }
        button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .btn-fetch { 
            background-color: #007bff; 
            color: white; 
        }
        .btn-fetch:hover { 
            background-color: #0056b3; 
        }
        .btn-print { 
            background-color: #28a745; 
            color: white; 
            display: none; 
        }
        .btn-print:hover { 
            background-color: #218838; 
        }
        #status { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 5px; 
            display: none; 
            text-align: center; 
            font-size: 14px; 
        }
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        /* Preview Area Styles */
        #previewArea {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 20px;
            background: white;
            display: none;
        }
        
        /* Print Specific Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }

        /* Document Style */
        .nid-doc {
            border: 2px solid #333;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .nid-header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .nid-row {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }
        .nid-label {
            font-weight: bold;
            width: 40%;
            color: #555;
        }
        .nid-value {
            width: 60%;
            color: #000;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container no-print">
    <h2>🚀 Server Copy Create</h2>
    
    <label for="nid">NID Number:</label>
    <input type="text" id="nid" placeholder="Enter your NID">

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">

    <div class="btn-group">
        <button class="btn-fetch" onclick="loadServerData()">📥 Load Data</button>
        <button class="btn-print" id="printBtn" onclick="generatePdf()">🖨️ Download PDF</button>
    </div>

    <div id="status"></div>
    
    <!-- Live Preview -->
    <div id="previewArea"></div>
</div>

<!-- Hidden Printable Area -->
<div id="printableArea"></div>

<script>
    const apiKey = '2a3b267ca79e6abc23fb675a0e381656';
    const proxyUrl = 'https://api.allorigins.win/raw?url='; 

    async function loadServerData() {
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;

        if (!nid || !dob) {
            alert("Please enter both NID and Date of Birth.");
            return;
        }

        const statusEl = document.getElementById('status');
        statusEl.className = 'loading';
        statusEl.style.display = 'block';
        statusEl.innerText = "Fetching data from server...";
        
        document.querySelector('.btn-fetch').disabled = true;
        document.getElementById('printBtn').style.display = 'none';
        document.getElementById('previewArea').style.display = 'none';

        try {
            // Use sv.php to get the JSON data
            const targetUrl = `https://servercopy.work/sv.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
            
            const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
            
            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            
            const jsonData = await response.json();
            
            if (!jsonData.success) {
                throw new Error(jsonData.message || "Failed to fetch data");
            }

            renderDocument(jsonData.data);
            showStatus("✅ Data Loaded Successfully!", "success");
            document.getElementById('printBtn').style.display = 'block';

        } catch (error) {
            console.error(error);
            showStatus("❌ Failed: " + error.message, "error");
            document.querySelector('.btn-fetch').disabled = false;
        }
    }

    function renderDocument(data) {
        // Helper to safely get value or empty string
        const val = (key) => data[key] ? data[key] : '';
        
        const htmlContent = `
            <div class="nid-doc">
                <div class="nid-header">
                    <h1>National ID Card (NID)</h1>
                    <p>Generated via ServerCopy.work</p>
                </div>
                
                <div class="nid-row"><div class="nid-label">NID Number:</div><div class="nid-value">${val('nid')}</div></div>
                <div class="nid-row"><div class="nid-label">Father's Name:</div><div class="nid-value">${val('father_name')}</div></div>
                <div class="nid-row"><div class="nid-label">Mother's Name:</div><div class="nid-value">${val('mother_name')}</div></div>
                <div class="nid-row"><div class="nid-label">Date of Birth:</div><div class="nid-value">${val('dob')}</div></div>
                <div class="nid-row"><div class="nid-label">Gender:</div><div class="nid-value">${val('gender')}</div></div>
                <div class="nid-row"><div class="nid-label">District:</div><div class="nid-value">${val('district')}</div></div>
                <div class="nid-row"><div class="nid-label">Upazila:</div><div class="nid-value">${val('upazila')}</div></div>
                <div class="nid-row"><div class="nid-label">Address:</div><div class="nid-value">${val('address')}</div></div>
                <div class="nid-row"><div class="nid-label">Blood Group:</div><div class="nid-value">${val('blood_group') || 'N/A'}</div></div>
                <div class="nid-row"><div class="nid-label">Religion:</div><div class="nid-value">${val('religion')}</div></div>
            </div>
        `;

        // Update Preview
        document.getElementById('previewArea').innerHTML = htmlContent;
        document.getElementById('previewArea').style.display = 'block';
        
        // Update Printable Area
        document.getElementById('printableArea').innerHTML = htmlContent;
    }

    function generatePdf() {
        window.print();
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.className = type;
        el.style.display = 'block';
        el.innerText = msg;
        if(type === 'success') setTimeout(() => el.style.display = 'none', 3000);
    }
</script>

</body>
</html>
