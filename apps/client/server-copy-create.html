<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Copy Create - Direct PDF</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #005bb5;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-size: 14px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-item {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #ddd;
        }
        .success { color: #065f46; font-weight: bold; }
        .error { color: #991b1b; font-weight: bold; }
        .info { color: #1e40af; }
        
        /* Hidden iframe to fetch PDF data without opening a new tab */
        #pdfFrame {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0070f3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Server Copy Create</h2>
    
    <form id="createForm">
        <label for="nid">NID Number:</label>
        <input type="text" id="nid" placeholder="আপনার NID নম্বর দিন" required pattern="\d{10}" title="Please enter a valid 10-digit NID">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <button type="submit" id="btnSubmit">Generate & Download PDF</button>
    </form>

    <!-- Status Log Area -->
    <div id="status"></div>
    
    <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<!-- Hidden iframe for processing -->
<iframe id="pdfFrame"></iframe>

<script>
    function addLog(message, type = 'info') {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        const logItem = document.createElement('div');
        logItem.className = `log-item ${type}`;
        logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        statusDiv.appendChild(logItem);
        statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;
        const btn = document.getElementById('btnSubmit');
        
        btn.disabled = true;
        btn.textContent = "Generating...";
        document.getElementById('status').innerHTML = ''; 
        
        try {
            addLog('সার্ভারে সংযোগ হচ্ছে...', 'info');
            
            // Configuration
            const baseUrl = 'https://servercopy.work';
            const apiKey = '2a3b267ca79e6abc23fb675a0e381656';
            
            // Step 1: Try to verify data first (Optional, but good for debugging)
            const apiUrl = `${baseUrl}/sv.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
            
            addLog(`Checking Data via sv.php...`, 'info');
            
            let isValid = false;
            try {
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const data = await response.json();
                    console.log("SV Response:", data);
                    if (data.success || data.data) {
                        isValid = true;
                        addLog('✅ সার্ভার ডাটা পাওয়া গেছে!', 'success');
                    } else {
                        addLog('⚠️ সার্ভার ডাটা পাওয়া যায়নি, তবে PDF জেনারেট করার চেষ্টা করা হচ্ছে...', 'error');
                        isValid = true; 
                    }
                } else {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
            } catch (err) {
                addLog(`ℹ️ sv.php থেকে তথ্য নেওয়া সম্ভব হয়নি (${err.message}), তবে PDF জেনারেট করার চেষ্টা করা হচ্ছে...`, 'info');
                isValid = true; // Proceed anyway
            }

            // Step 2: Generate PDF
            const pdfUrl = `${baseUrl}/pdf.php?key=${apiKey}&nid=${nid}&dob=${dob}`;
            
            addLog(`PDF URL: ${pdfUrl}`, 'info');
            addLog('PDF প্রস্তুত হচ্ছে...', 'info');
            
            // Load the PDF/HTML into the hidden iframe
            const iframe = document.getElementById('pdfFrame');
            iframe.src = pdfUrl;

            // Wait for iframe to load, then trigger print/download
            iframe.onload = function() {
                try {
                    // Attempt to trigger print dialog which usually allows saving as PDF
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // If it's HTML, we can inject a print button or just call window.print on the iframe context
                    // However, standard practice for direct download from iframe is tricky.
                    // Best approach: Open a temporary window specifically for printing and close it immediately after.
                    
                    addLog('PDF প্রিন্ট মেলামুখ খোলা হচ্ছে...', 'info');
                    
                    // Create a new window for printing to ensure "Save as PDF" option appears cleanly
                    const printWindow = window.open('', '_blank', 'height=700,width=900');
                    printWindow.document.write('<html><head><title>NID Document</title>');
                    printWindow.document.write('<style>body{font-family:Arial,sans-serif;padding:20px;} @media print{body{padding:0;}}</style>');
                    
                    // Clone the iframe content safely
                    const content = iframeDoc.documentElement.outerHTML;
                    printWindow.document.write(content);
                    printWindow.document.write('</body></html>');
                    printWindow.document.close();
                    
                    // Small delay to ensure rendering
                    setTimeout(() => {
                        printWindow.focus();
                        printWindow.print();
                        
                        // Close the print window automatically after a few seconds
                        setTimeout(() => {
                            printWindow.close();
                            addLog('✅ PDF ডাউনলোড শেষ! আপনি এখন বন্ধ করতে পারেন।', 'success');
                        }, 2000);
                    }, 500);

                } catch (err) {
                    addLog(`❌ PDF প্রসেসিংয়ে সমস্যা হয়েছে: ${err.message}`, 'error');
                }
            };

        } catch (error) {
            console.error("Error:", error);
            addLog(`❌ ত্রুটি: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate & Download PDF";
        }
    });
</script>

</body>
</html>
