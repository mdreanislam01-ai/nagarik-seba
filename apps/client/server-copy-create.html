<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Server Copy</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #005bb5;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-size: 14px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-item {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #ddd;
        }
        .success { color: #065f46; font-weight: bold; }
        .error { color: #991b1b; font-weight: bold; }
        .info { color: #1e40af; }
        
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0070f3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Secure Copy Create</h2>
    
    <form id="createForm">
        <label for="nid">NID Number:</label>
        <input type="text" id="nid" placeholder="আপনার NID নম্বর দিন" required pattern="\d{10}" title="Please enter a valid 10-digit NID">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <button type="submit" id="btnSubmit">Generate & Download PDF</button>
    </form>

    <!-- Status Log Area -->
    <div id="status"></div>
    
    <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<script>
    // 🔒 Encoded API Key
    const API_KEY = atob('MmEzYjI2N2NhNzllNmFiYzIzZmI2NzVhMGUzODE2NTY=');
    const SERVER_BASE = 'https://servercopy.work'; 

    function addLog(message, type = 'info') {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        const logItem = document.createElement('div');
        logItem.className = `log-item ${type}`;
        logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        statusDiv.appendChild(logItem);
        statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;
        const btn = document.getElementById('btnSubmit');
        
        btn.disabled = true;
        btn.textContent = "Processing...";
        document.getElementById('status').innerHTML = ''; 
        
        try {
            addLog('Connecting to secure server...', 'info');
            
            // Step 1: Verify Data
            const apiUrl = `${SERVER_BASE}/sv.php?key=${API_KEY}&nid=${nid}&dob=${dob}`;
            
            let isValid = false;
            try {
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success || data.data) {
                        isValid = true;
                        addLog('✅ Data verified successfully.', 'success');
                    } else {
                        addLog('⚠️ Data mismatch, proceeding anyway.', 'error');
                        isValid = true; 
                    }
                } else {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
            } catch (err) {
                addLog(`ℹ️ Verification skipped (${err.message}), generating PDF directly.`, 'info');
                isValid = true; 
            }

            // Step 2: Generate PDF using Hidden Iframe Strategy
            const pdfUrl = `${SERVER_BASE}/pdf.php?key=${API_KEY}&nid=${nid}&dob=${dob}`;
            
            addLog('Generating PDF via secure channel...', 'info');
            
            // Create a hidden iframe
            const iframe = document.createElement('iframe');
            iframe.style.position = 'absolute';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = 'none';
            document.body.appendChild(iframe);

            iframe.onload = () => {
                try {
                    // Try to access the iframe's document object
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    if (iframeDoc && iframeDoc.body) {
                        addLog('PDF content loaded successfully in memory.', 'success');
                        
                        // Clone the content to avoid any cross-origin read issues during print
                        const htmlContent = iframeDoc.documentElement.outerHTML;
                        const blob = new Blob([htmlContent], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        
                        const printWindow = window.open(url, '_blank');
                        
                        if (!printWindow) {
                            addLog('❌ Popup blocked! Please allow popups.', 'error');
                            URL.revokeObjectURL(url);
                            return;
                        }

                        printWindow.onload = () => {
                            setTimeout(() => {
                                printWindow.focus();
                                printWindow.print();
                                
                                setTimeout(() => {
                                    printWindow.close();
                                    addLog('✅ Done.', 'success');
                                    URL.revokeObjectURL(url);
                                }, 2000);
                            }, 500);
                        };
                    } else {
                        throw new Error("Could not read iframe content");
                    }
                } catch (readErr) {
                    // Fallback: Just open the link directly if reading fails
                    addLog('⚠️ Direct fallback initiated due to read restriction.', 'info');
                    window.open(pdfUrl, '_blank');
                } finally {
                    // Clean up iframe
                    setTimeout(() => {
                        document.body.removeChild(iframe);
                    }, 1000);
                }
            };

            // Set source to trigger load
            iframe.src = pdfUrl;

        } catch (error) {
            console.error("Error:", error);
            addLog(`❌ Critical Error: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate & Download PDF";
        }
    });
</script>

</body>
</html>
