<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Server Copy</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #005bb5;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-size: 14px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-item {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #ddd;
        }
        .success { color: #065f46; font-weight: bold; }
        .error { color: #991b1b; font-weight: bold; }
        .info { color: #1e40af; }
        
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0070f3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Secure Copy Create</h2>
    
    <form id="createForm">
        <label for="nid">NID Number:</label>
        <input type="text" id="nid" placeholder="আপনার NID নম্বর দিন" required pattern="\d{10}" title="Please enter a valid 10-digit NID">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <button type="submit" id="btnSubmit">Generate & Download PDF</button>
    </form>

    <!-- Status Log Area -->
    <div id="status"></div>
    
    <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<script>
    // 🔒 Encoded API Key
    const API_KEY = atob('MmEzYjI2N2NhNzllNmFiYzIzZmI2NzVhMGUzODE2NTY=');
    const SERVER_BASE = 'https://servercopy.work'; 

    function addLog(message, type = 'info') {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        const logItem = document.createElement('div');
        logItem.className = `log-item ${type}`;
        logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        statusDiv.appendChild(logItem);
        statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;
        const btn = document.getElementById('btnSubmit');
        
        btn.disabled = true;
        btn.textContent = "Processing...";
        document.getElementById('status').innerHTML = ''; 
        
        try {
            addLog('Connecting to secure server...', 'info');
            
            // Step 1: Verify Data
            const apiUrl = `${SERVER_BASE}/sv.php?key=${API_KEY}&nid=${nid}&dob=${dob}`;
            
            let isValid = false;
            try {
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success || data.data) {
                        isValid = true;
                        addLog('✅ Data verified successfully.', 'success');
                    } else {
                        addLog('⚠️ Data mismatch, proceeding anyway.', 'error');
                        isValid = true; 
                    }
                } else {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
            } catch (err) {
                addLog(`ℹ️ Verification skipped (${err.message}), generating PDF directly.`, 'info');
                isValid = true; 
            }

            // Step 2: Fetch PDF Content and Print
            const pdfUrl = `${SERVER_BASE}/pdf.php?key=${API_KEY}&nid=${nid}&dob=${dob}`;
            
            addLog('Fetching PDF content securely...', 'info');
            
            try {
                const response = await fetch(pdfUrl);
                if (!response.ok) throw new Error('Failed to fetch PDF content');
                
                const htmlContent = await response.text();
                
                // Create a Blob URL to handle the content safely without cross-origin issues
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                // Open in a new window for printing, but this is standard behavior
                // If you strictly want NO new tab, you can't really "print" without a print dialog which usually opens a preview or uses the current context.
                // However, we can use a hidden iframe to trigger print on the CURRENT page's context if the server allows it, 
                // but since server blocks cross-origin, we'll use a temporary blob URL in a new window which is cleaner.
                
                const printWindow = window.open(url, '_blank');
                
                if (!printWindow) {
                    addLog('❌ Popup blocked! Please allow popups for this site.', 'error');
                    URL.revokeObjectURL(url);
                    return;
                }

                printWindow.onload = () => {
                    setTimeout(() => {
                        printWindow.focus();
                        printWindow.print();
                        
                        // Auto-close after print dialog
                        setTimeout(() => {
                            printWindow.close();
                            addLog('✅ Done. You can close the preview window.', 'success');
                            URL.revokeObjectURL(url);
                        }, 2000);
                    }, 500);
                };

            } catch (fetchErr) {
                addLog(`❌ Failed to load PDF: ${fetchErr.message}`, 'error');
            }

        } catch (error) {
            console.error("Error:", error);
            addLog(`❌ Critical Error: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate & Download PDF";
        }
    });
</script>

</body>
</html>
