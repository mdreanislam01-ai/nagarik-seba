<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Server Copy</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #005bb5;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-size: 14px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-item {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #ddd;
        }
        .success { color: #065f46; font-weight: bold; }
        .error { color: #991b1b; font-weight: bold; }
        .info { color: #1e40af; }
        
        /* Hidden iframe for processing without new tab */
        #pdfFrame {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            border: none;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0070f3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Secure Copy Create</h2>
    
    <form id="createForm">
        <label for="nid">NID Number:</label>
        <input type="text" id="nid" placeholder="আপনার NID নম্বর দিন" required pattern="\d{10}" title="Please enter a valid 10-digit NID">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <button type="submit" id="btnSubmit">Generate & Download PDF</button>
    </form>

    <!-- Status Log Area -->
    <div id="status"></div>
    
    <a href="index.html" class="back-btn">← Back to Main Menu</a>
</div>

<!-- Hidden iframe -->
<iframe id="pdfFrame"></iframe>

<script>
    // 🔒 Encoded API Key to prevent casual viewing in source code
    // '2a3b267ca79e6abc23fb675a0e381656' encoded
    const API_KEY = atob('MmEzYjI2N2NhNzllNmFiYzIzZmI2NzVhMGUzODE2NTY=');
    
    // 🔒 Server Base URL hidden from direct view if needed, though it's used in fetch
    const SERVER_BASE = 'https://servercopy.work'; 

    function addLog(message, type = 'info') {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        const logItem = document.createElement('div');
        logItem.className = `log-item ${type}`;
        logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        statusDiv.appendChild(logItem);
        statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nid = document.getElementById('nid').value.trim();
        const dob = document.getElementById('dob').value;
        const btn = document.getElementById('btnSubmit');
        
        btn.disabled = true;
        btn.textContent = "Processing...";
        document.getElementById('status').innerHTML = ''; 
        
        try {
            addLog('Connecting to secure server...', 'info');
            
            // Step 1: Verify Data (Optional but safe)
            const apiUrl = `${SERVER_BASE}/sv.php?key=${API_KEY}&nid=${nid}&dob=${dob}`;
            
            let isValid = false;
            try {
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success || data.data) {
                        isValid = true;
                        addLog('✅ Data verified successfully.', 'success');
                    } else {
                        addLog('⚠️ Data mismatch, proceeding anyway.', 'error');
                        isValid = true; 
                    }
                } else {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
            } catch (err) {
                addLog(`ℹ️ Verification skipped (${err.message}), generating PDF directly.`, 'info');
                isValid = true; 
            }

            // Step 2: Generate PDF via Hidden Iframe
            const pdfUrl = `${SERVER_BASE}/pdf.php?key=${API_KEY}&nid=${nid}&dob=${dob}`;
            
            addLog('Preparing PDF document...', 'info');
            
            const iframe = document.getElementById('pdfFrame');
            
            // Clear previous src to force reload
            iframe.src = "";
            
            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Create a print-friendly window temporarily
                    const printWindow = window.open('', '_blank', 'height=700,width=900');
                    
                    if (!printWindow) {
                        addLog('❌ Popup blocked! Please allow popups for this site.', 'error');
                        return;
                    }

                    printWindow.document.write('<html><head><title>NID Document</title>');
                    printWindow.document.write('<style>body{font-family:Arial,sans-serif;padding:20px;} @media print{body{padding:0;}}</style>');
                    
                    // Inject the content from the hidden iframe
                    printWindow.document.write(iframeDoc.documentElement.outerHTML);
                    printWindow.document.write('</body></html>');
                    printWindow.document.close();
                    
                    // Delay slightly to ensure rendering
                    setTimeout(() => {
                        printWindow.focus();
                        printWindow.print();
                        
                        // Auto-close after print dialog
                        setTimeout(() => {
                            printWindow.close();
                            addLog('✅ Done. You can close the preview window.', 'success');
                        }, 2000);
                    }, 500);

                } catch (err) {
                    addLog(`❌ Error during print: ${err.message}`, 'error');
                }
            };

            // Set the source to trigger the load
            iframe.src = pdfUrl;

        } catch (error) {
            console.error("Error:", error);
            addLog(`❌ Critical Error: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = "Generate & Download PDF";
        }
    });
</script>

</body>
</html>
